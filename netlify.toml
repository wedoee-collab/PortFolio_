# En-têtes de sécurité et de cache appliqués par Netlify à chaque réponse.

[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS pendant 1 an (y compris sur les sous-domaines)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Empêche l'affichage du site dans une iframe d'un autre site (protection contre le clickjacking).
    # SAMEORIGIN et non DENY : la page Stages affiche le rapport PDF dans une iframe du site.
    X-Frame-Options = "SAMEORIGIN"
    # Limite les sources de contenu au site, à Google Fonts et à cdnjs (Font Awesome)
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; frame-src 'self'; object-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    # Empêche le navigateur de deviner le type MIME d'un fichier
    X-Content-Type-Options = "nosniff"
    # Ne transmet pas l'URL complète aux sites externes
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Désactive les API sensibles dont le site n'a pas besoin
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Les images et PDF ne changent pas de nom : on peut les mettre en cache longtemps.
[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=604800"
