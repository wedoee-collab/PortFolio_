# En-têtes de sécurité et de cache appliqués par Netlify à chaque réponse.

[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS pendant 1 an (y compris sur les sous-domaines)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Empêche l'affichage du site dans une iframe (protection contre le clickjacking)
    X-Frame-Options = "DENY"
    # Empêche le navigateur de deviner le type MIME d'un fichier
    X-Content-Type-Options = "nosniff"
    # Ne transmet pas l'URL complète aux sites externes
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Désactive les API sensibles dont le site n'a pas besoin
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Les images et PDF ne changent pas de nom : on peut les mettre en cache longtemps.
[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=604800"
